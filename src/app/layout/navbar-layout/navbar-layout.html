<header class="top-toolbar">
  
  <!-- La barre de recherche a été supprimée, l'espace se remplit automatiquement -->
  <div class="toolbar-spacer"></div>

  <!-- Bouton des notifications en temps réel -->
  <button mat-icon-button class="notification-button">
    <span class="material-icons">notifications_none</span>
    <span class="notification-badge">3</span>
  </button>

  <!-- Zone Profil de l'utilisateur connecté -->
  <div class="user-profile">
    <div class="user-avatar">KS</div>

    <div class="user-info">
      <strong>Kadiatou Sangaré</strong>
      <span>Porteur de projet</span>
    </div>

    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <span class="material-icons">expand_more</span>
    </button>
  </div>

  <!-- Menu Déroulant Angular Material -->
  <mat-menu #userMenu="matMenu">
    <!-- CORRECTION : Ouvre le profil du projet actif -->
    <button mat-menu-item routerLink="profil">
      <span class="material-icons">person</span>
      <span>Mon profil</span>
    </button>

    <!-- CORRECTION : Remonte d'un cran pour retourner au sélecteur multi-projets -->
    <button mat-menu-item routerLink="/porteur/mes-projets">
      <span class="material-icons">apps</span>
      <span>Changer de projet</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="logout()">
      <span class="material-icons">logout</span>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</header>
