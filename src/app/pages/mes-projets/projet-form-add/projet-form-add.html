<div class="modal-overlay" (click)="fermerModale()">
  <div class="project-card" (click)="$event.stopPropagation()">

    <!-- EN-TÊTE -->
    <div class="modal-header">
      <div class="brand-logo">
        <mat-icon class="brand-icon">rocket_launch</mat-icon>
        <span class="brand-title">Nouveau <span>Projet</span></span>
      </div>
      <button mat-icon-button type="button" class="close-btn" aria-label="Fermer" [disabled]="chargement" (click)="fermerModale()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="modal-intro">
      <h1>Propulsez une idée</h1>
      <p>Renseignez les détails de la startup pour l'incubateur.</p>
    </div>

    <!-- FORMULAIRE RACCORDÉ ÉNERGIQUEMENT -->
    <form [formGroup]="projectForm" (ngSubmit)="soumettreProjet()" class="project-form">

      <!-- Ligne 1 : Nom + Secteur -->
      <div class="form-row">
        <div class="field-group">
          <label for="nomProjet">Nom du projet <span>*</span></label>
          <div class="input-wrapper">
            <mat-icon>business_center</mat-icon>
            <input id="nomProjet" type="text" formControlName="nom" placeholder="Ex. Waati Delivery" />
          </div>
        </div>

        <div class="field-group">
          <label for="secteurProjet">Secteur d'activité <span>*</span></label>
          <div class="input-wrapper">
            <mat-icon>category</mat-icon>
            <mat-select id="secteurProjet" formControlName="secteur" placeholder="Sélectionner...">
              <mat-option value="1">Agriculture & Agrotech</mat-option>
              <mat-option value="2">Fintech & Finance</mat-option>
              <mat-option value="3">Santé & Biotech</mat-option>
              <mat-option value="4">Énergie & Tech</mat-option>
            </mat-select>
          </div>
        </div>
      </div>

      <!-- Ligne 2 : Quota & Offre investisseur -->
      <div class="field-group">
        <label for="quotaPropose">Quota & Offre investisseur</label>
        <div class="input-wrapper">
          <mat-icon>monetization_on</mat-icon>
          <input id="quotaPropose" type="text" formControlName="quota" placeholder="Ex. 15% du capital cédé contre un accompagnement de 10M FCFA" />
        </div>
      </div>

      <!-- Ligne 3 : Import du Pitch (Vidéo ou Document) -->
      <div class="field-group">
        <label for="pitchFile">Document ou Vidéo du Pitch (PDF, PPTX, MP4, etc.)</label>

        <!-- Input réel masqué -->
        <input id="pitchFile" type="file" accept=".pdf,.ppt,.pptx,.mp4,.mov,.avi,video/*" class="hidden-file-input" [disabled]="chargement" (change)="onFileSelected($event)" />

        <!-- Zone d'upload dynamique avec prévisualisation -->
        <label for="pitchFile" class="file-upload-zone" [class.has-file]="fichierPitch">
          <div class="upload-content">
            <div class="upload-icon">
              <mat-icon>{{ fichierPitch?.type?.startsWith('video/') ? 'movie' : (fichierPitch ? 'description' : 'cloud_upload') }}</mat-icon>
            </div>
            <div class="upload-text">
              @if (fichierPitch) {
                <span class="upload-title filename">{{ fichierPitch.name }}</span>
                <span class="upload-hint">{{ (fichierPitch.size / 1024 / 1024) | number:'1.1-2' }} MB • Cliquez pour remplacer</span>
              } @else {
                <span class="upload-title">Cliquez pour importer <span>un fichier</span></span>
                <span class="upload-hint">PDF, PPTX ou Vidéo MP4/MOV (max. 50MB)</span>
              }
            </div>
          </div>

          @if (fichierPitch && !chargement) {
            <button type="button" class="remove-file-btn" aria-label="Supprimer le fichier" (click)="supprimerFichier($event)">
              <mat-icon>close</mat-icon>
            </button>
          }
        </label>
      </div>

      <!-- Ligne 4 : Description -->
      <div class="field-group">
        <label for="descriptionProjet">Description du projet</label>
        <div class="input-wrapper textarea-wrapper">
          <mat-icon>description</mat-icon>
          <textarea id="descriptionProjet" formControlName="description" placeholder="Objectifs majeurs et vision de la startup..." rows="3"></textarea>
        </div>
      </div>

      <!-- ACTIONS AVEC PROTECTION CONTRE LES DOUBLES CLICS -->
      <div class="modal-actions">
        <button type="button" class="btn-cancel" [disabled]="chargement" (click)="fermerModale()">Annuler</button>
        <button type="submit" class="btn-submit" [disabled]="projectForm.invalid || chargement">
          {{ chargement ? 'Traitement en cours...' : 'Initialiser le dossier' }}
        </button>
      </div>

    </form>

  </div>
</div>
